<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>OneDoor</title>
    <link rel="manifest" href="/manifest.json">
    <script>
      const isIOS = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">
    <script src="/jssip.min.js"></script>

    <style>
        :root { --bg: #000; --panel: #1a1a1a; --green: #22c55e; --red: #ef4444; --text: #fff; --blue: #3b82f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            height: 100dvh; 
            overflow: hidden;
            position: relative;
            backface-visibility: hidden;
        }

        #video-container {
            position: absolute; inset: 0; background: #000;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: cover; background: #000; }

        #controls {
            display: none;
            position: fixed;
            z-index: 1000;
            background: var(--panel);
            gap: 8px;
            padding: 12px;
            transition: none;
            will-change: transform;
            align-items: stretch;
            justify-items: stretch;
        }

        @media (orientation: portrait) {
            #controls {
                bottom: 0; left: 0; right: 0;
                height: 72px;
                padding-bottom: 18px;
                display: grid;
                grid-auto-flow: column;
                grid-auto-columns: 1fr;
            }
        }

        @media (orientation: landscape) {
            #controls {
                top: 0; bottom: 0; right: 0;
                width: 80px;
                padding-top: 12px;
                padding-bottom: 12px;
                display: grid;
                grid-auto-flow: row;
                grid-auto-rows: 1fr;
            }
        }

        button { 
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px; 
            border: none; 
            font-weight: 600; 
            font-size: 14px; 
            cursor: pointer; 
            color: #fff; 
            white-space: nowrap; 
            overflow: hidden;
        }
        .btn-call { background: var(--green); }
        .btn-hangup { background: var(--red); display: none; }
        .btn-action { background: #333; border: 1px solid #444; }

        #login { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; }
        #audio-blocker { position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 150; display: none; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
        form { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 12px; }
        input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid #333; background: #111; color: #fff; font-size: 16px; outline: none; }
        .hidden { display: none !important; }
        #status { position: absolute; top: 12px; left: 12px; font-size: 10px; font-weight: bold; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; z-index: 50; letter-spacing: 0.05em; }
    </style>
</head>
<body>

<div id="status">OFFLINE</div>

<div id="video-container">
    <video id="video" autoplay playsinline muted></video>
    <audio id="remoteAudio" autoplay playsinline></audio>

    <div id="audio-blocker" onclick="unmuteAudio()">
        <div style="background:#fff; color:#000; padding: 20px; border-radius: 50px; font-weight: bold;">
            🔊 TAP TO HEAR AUDIO
        </div>
    </div>

    <div id="login">
        <h2 style="margin-bottom:20px; letter-spacing: -1px;">OneDoor</h2>
        <form id="login-form" onsubmit="doLogin(event)">
            <input type="text" id="username" placeholder="Username" autocomplete="username" required>
            <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
            <button type="submit" style="background:#fff; color:#000; margin-top:10px">Sign In</button>
        </form>
    </div>
</div>

<div id="controls"></div>

<script>
let ua, session, videoPC, configData;
const API = window.location.origin;
const $ = id => document.getElementById(id);
const setStatus = t => { $('status').textContent = t.toUpperCase(); };

function unmuteAudio() {
    $('remoteAudio').play();
    $('audio-blocker').style.display = 'none';
}

// --- 1. VIDEO LOGIC (Status Cleaned) ---
async function loadWebRTC(name) {
    if (videoPC) videoPC.close(); // Prevent ghost connections on refresh
    
    videoPC = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

    videoPC.ontrack = e => {
        if (e.streams[0]) {
            console.log("Video track received from go2rtc");
            const v = $('video');
            v.srcObject = e.streams[0];
            v.play().catch(err => console.warn("Video playback pending interaction"));
        }
    };

    videoPC.addTransceiver('video', { direction: 'recvonly' });
    videoPC.addTransceiver('audio', { direction: 'inactive' });

    try {
        const offer = await videoPC.createOffer();
        await videoPC.setLocalDescription(offer);

        const res = await fetch(`${API}/go2rtc/api/webrtc?src=${encodeURIComponent(name)}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'text/plain',
                'Authorization': `Bearer ${configData.token}`
            },
            body: videoPC.localDescription.sdp
        });

        if (!res.ok) throw new Error('Unauthorized');
        const answer = await res.text();
        await videoPC.setRemoteDescription({ type: 'answer', sdp: answer });
    } catch (e) {
        console.error("Video Error:", e);
    }
}

// --- 2. SIP LOGIC ---
function setupSIP() {
    const wsUrl = `wss://${location.host}/ws?ws_token=${encodeURIComponent(configData.ws_token)}`;
    const socket = new JsSIP.WebSocketInterface(wsUrl);

    ua = new JsSIP.UA({
        sockets: [socket],
        uri: `sip:${configData.pbx.username}@${location.hostname}`,
        password: configData.pbx.password,
        register: true,
        session_timers: false,
        user_agent: configData.pbx.user_agent
    });

    ua.on('registered', () => setStatus('READY'));
    ua.on('registrationFailed', () => setStatus('SIP ERROR'));
    ua.on('newRTCSession', e => {
        session = e.session;
        handleSession();
    });
    ua.start();
}

function handleSession() {
    const attachTrack = () => {
        if (session && session.connection) {
            const receiver = session.connection.getReceivers().find(r => r.track && r.track.kind === 'audio');
            if (receiver && receiver.track) {
                const el = $('remoteAudio');
                el.srcObject = new MediaStream([receiver.track]);
                el.play().catch(() => {
                    $('audio-blocker').style.display = 'flex';
                });
            }
        }
    };

    session.on('peerconnection', d => {
        d.peerconnection.ontrack = () => attachTrack();
    });

    session.on('confirmed', () => {
        $('callBtn').style.display = 'none';
        $('hangupBtn').style.display = 'block';
        setStatus('IN CALL');
        setTimeout(attachTrack, 100);
    });

    session.on('ended', resetUI);
    session.on('failed', resetUI);
}

function startCall() {
    if (!ua || !ua.isRegistered()) {
        setStatus("NOT READY");
        return;
    }
    const options = {
        mediaConstraints: { audio: true, video: false },
        pcConfig: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
    };
    ua.call(`sip:${configData.pbx.dial_extension}@${location.hostname}`, options);
}

function hangup() { session?.terminate(); }
function resetUI() {
    if ($('callBtn')) $('callBtn').style.display = 'block';
    if ($('hangupBtn')) $('hangupBtn').style.display = 'none';
    $('audio-blocker').style.display = 'none';
    setStatus('READY');
}

// --- 3. ACTION LOGIC ---
async function runAction(action) {
    if (action.type === 'dtmf') {
        if (session) {
            session.sendDTMF(action.payload);
            setStatus(`SENT: ${action.payload}`);
        }
    } else if (action.type === 'hook') {
        setStatus('SENDING...');
        const res = await fetch(`${API}/api/action`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${configData.token}`
            },
            body: JSON.stringify({ actionId: action.id })
        });
        if (res.ok) setStatus('SUCCESS');
    } 
    // ADD: Handle the local redirection directly from client context
    else if (action.type === 'link') {
        if (action.url) {
            window.location.href = action.url;
            return; // Exit early so the status timeout doesn't fire as the page unloads
        } else {
            setStatus('LINK ERR');
        }
    }
    setTimeout(() => setStatus(session?.isEstablished() ? 'IN CALL' : 'READY'), 2000);
}

async function doLogin(event) {
    event.preventDefault();
    const u = $('username').value, p = $('password').value;
    try {
        const res = await fetch(`${API}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        });
        if (!res.ok) throw new Error('Auth Failed');
        configData = await res.json();
        localStorage.setItem('jwt', configData.token);
        initApp();
    } catch (e) { alert(e.message); }
}

window.onload = () => {
    const token = localStorage.getItem('jwt');
    if (token) {
        fetch(`${API}/api/verify`, {
            headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(res => res.json())
        .then(data => {
            if (data.valid) {
                configData = data;
                initApp();
            }
        }).catch(() => localStorage.removeItem('jwt'));
    }
};

// --- PUSH OPT-IN (Zero UI Impact + Orphan Recovery) ---
const PUSH_LATER_KEY = 'onedoor_push_later';
const PUSH_WEEK_MS = 7 * 24 * 60 * 60 * 1000;

function urlBase64ToUint8Array(base64url) {
  // 1. Convert base64url to standard base64 FIRST
  let base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
  
  // 2. Add padding if needed
  const pad = (4 - base64.length % 4) % 4;
  base64 += '='.repeat(pad);
  
  // 3. NOW safely decode
  const binary = atob(base64);
  
  // 4. Convert to Uint8Array
  return new Uint8Array([...binary].map(c => c.charCodeAt(0)));
}

async function registerPush() {
  console.log('🔧 registerPush() called');
  
  if (!configData?.vapid_public_key) {
    console.error('❌ No VAPID key');
    return;
  }
  
  try {
    console.log('🔍 Getting service worker...');
    const reg = await navigator.serviceWorker.getRegistration('/') || 
                await navigator.serviceWorker.register('/service-worker.js');
    console.log('✅ SW registered:', reg.scope);
    
    console.log('🔍 Getting subscription...');
    let sub = await reg.pushManager.getSubscription();
    console.log('📦 Existing subscription:', sub ? 'YES' : 'NO');
    
    if (!sub) {
      console.log('🔔 Creating new subscription...');
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(configData.vapid_public_key)
      });
      console.log('✅ Subscription created');
    }
    
    console.log('📡 POSTing to backend...');
    const res = await fetch(`${location.origin}/api/register-notification`, {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${configData.token}`
      },
      body: JSON.stringify({ subscription: sub.toJSON() })
    });
    
    console.log('📡 HTTP Status:', res.status, res.statusText);
    const data = await res.json();
    console.log('🔔 Backend response:', data);
    
  } catch(e) {
    console.error('💥 registerPush() error:', e.name, e.message);
  }
}

function showPushModal(force = false) {
  if (!configData?.vapid_public_key) return;
  if (!force && Notification.permission !== 'default') return; // Skip gate unless forced
  if (!force && Date.now() - parseInt(localStorage.getItem(PUSH_LATER_KEY) || '0') < PUSH_WEEK_MS) return;
  if (!force && localStorage.getItem('push_opted') === 'denied') return;

  const title = force ? "Re-enable Notifications?" : "Instant Door Alerts?";
  const msg = force ? "Tap to restore instant door alerts." : "Tap to open when someone rings.";

  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity 0.2s;';
  el.innerHTML = `
    <div style="background:#111;border:1px solid #333;border-radius:14px;padding:20px;max-width:300px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.5);">
      <div style="font-size:24px;margin-bottom:8px;">🔔</div>
      <h3 style="margin:0 0 6px;font-size:16px;color:#fff;">${title}</h3>
      <p style="margin:0 0 16px;font-size:13px;color:#999;line-height:1.4;">${msg}</p>
      <div style="display:flex;gap:10px;">
        <button id="push-allow" style="flex:1;padding:10px;border:none;border-radius:8px;background:#22c55e;color:#fff;font-weight:600;font-size:14px;cursor:pointer;">Allow</button>
        ${!force ? `<button id="push-later" style="flex:1;padding:10px;border:none;border-radius:8px;background:#222;color:#aaa;font-weight:600;font-size:14px;cursor:pointer;">Ask Later</button>` : ''}
      </div>
    </div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.style.opacity = '1');

  document.getElementById('push-allow').onclick = async () => {
    el.remove();
    await Notification.requestPermission(); // Returns 'granted' instantly if already allowed
    localStorage.setItem('push_opted', 'allowed');
    localStorage.removeItem(PUSH_LATER_KEY);
    registerPush();
  };

  if (!force) {
    document.getElementById('push-later').onclick = () => {
      el.remove();
      localStorage.setItem(PUSH_LATER_KEY, Date.now().toString());
    };
  }
}

//  REPLACES initApp() PUSH CALL:
async function initPushFlow() {
  console.log('🔥 initPushFlow() START');

  // Gate 1: Do we have config?
  if (!configData) {
    console.error('❌ configData is undefined — initPushFlow() called too early?');
    return;
  }
  console.log('✅ configData exists');

  // Gate 2: Is push enabled on server?
  if (!configData.vapid_public_key) {
    console.log('⚠️ configData.vapid_public_key is null/undefined — push disabled on server');
    return;
  }
  console.log('✅ VAPID public key present:', configData.vapid_public_key.substring(0,20) + '...');

  // Gate 3: Does browser support Notifications API?
  if (!('Notification' in window)) {
    console.error('❌ Notification API not supported in this browser');
    return;
  }
  console.log('✅ Notification API supported');

  // Gate 4: What's the current permission state?
  const perm = Notification.permission;
  console.log('🔍 Notification.permission =', perm);

  // ✅ NEW: MISMATCH DETECTION
  if (configData.push_status === 'missing' && perm === 'granted') {
    console.log('⚠️ Push mismatch: Browser granted, backend missing. Forcing re-register prompt.');
    localStorage.removeItem('push_opted');
    localStorage.removeItem(PUSH_LATER_KEY);
    showPushModal(true);
    console.log('🔚 initPushFlow() END (mismatch recovery)');
    return;
  }

  // --- existing logic ---
  if (perm === 'granted') {
    console.log('✅ Permission granted — attempting silent registration...');
    try {
      await registerPush();
      console.log('✅ registerPush() completed');
    } catch (e) {
      console.error('💥 registerPush() threw error:', e.message);
      setTimeout(() => showPushModal(true), 1000);
    }
  }
  else if (perm === 'default') {
    console.log('⏳ Permission undecided — scheduling modal in 1.5s...');
    setTimeout(() => {
      console.log('⏰ showPushModal() triggered');
      showPushModal(false);
    }, 1500);
  }
  else if (perm === 'denied') {
    console.log('🚫 Permission denied — will not prompt again');
  }

  console.log('🔚 initPushFlow() END');
}

//  app flow
async function initApp() {
    $('login').classList.add('hidden');
    const ctrl = $('controls');
    ctrl.style.display = 'grid';
    ctrl.innerHTML = '';

    const callBtn = document.createElement('button');
    callBtn.id = 'callBtn';
    callBtn.className = 'btn-call';
    callBtn.innerHTML = '📞 CALL';
    callBtn.onclick = startCall;
    ctrl.appendChild(callBtn);

    configData.actions.forEach(action => {
        const btn = document.createElement('button');
        btn.className = 'btn-action';
        btn.innerHTML = `${action.icon} ${action.label}`;
        btn.onclick = () => runAction(action);
        ctrl.appendChild(btn);
    });

    const hangBtn = document.createElement('button');
    hangBtn.id = 'hangupBtn';
    hangBtn.className = 'btn-hangup';
    hangBtn.innerHTML = '📴 END';
    hangBtn.onclick = hangup;
    ctrl.appendChild(hangBtn);

    loadWebRTC(configData.video.name);
    setTimeout(setupSIP, 500);

    // 🔔 PUSH: Auto-flow + orphan recovery
    initPushFlow();
}

</script>
</body>
</html>
