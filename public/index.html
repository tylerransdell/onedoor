<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>OneDoor</title>
    <link rel="manifest" href="/manifest.json">
    <script>
      const isIOS = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">
    <script src="/jssip.min.js"></script>

    <style>
        :root { --bg: #000; --panel: #1a1a1a; --green: #22c55e; --red: #ef4444; --text: #fff; --blue: #3b82f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            height: 100dvh;
            overflow: hidden;
            position: relative;
            backface-visibility: hidden;
        }

        #video-container {
            position: absolute; inset: 0; background: #000;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            touch-action: pan-y;
        }
        video { width: 100%; height: 100%; object-fit: cover; background: #000; }

        #door-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px;
            font-size: 14px; font-weight: 600; z-index: 50; pointer-events: none;
            text-transform: capitalize; white-space: nowrap;
        }

        .nav-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.5); color: #fff; font-size: 24px;
            width: 40px; height: 80px; display: none;
            align-items: center; justify-content: center;
            cursor: pointer; z-index: 50; border-radius: 8px;
            user-select: none;
        }
        #nav-left { left: 10px; }
        #nav-right { right: 10px; }

        @media (hover: hover) and (pointer: fine) {
            .nav-arrow { display: flex; }
        }

        #controls {
            display: none;
            position: fixed;
            z-index: 1000;
            background: var(--panel);
            gap: 8px;
            padding: 12px;
            transition: none;
            will-change: transform;
        }

        @media (orientation: portrait) {
            #controls {
                bottom: 0; left: 0; right: 0;
                min-height: 90px;
                padding: 12px 12px 24px 12px;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
            }
            #controls button { flex: 1 1 40%; max-width: 200px; }
        }

        @media (orientation: landscape) {
            #video-container { right: 25vw; left: 0; }
            #controls {
                top: 0; bottom: 0; right: 0;
                width: 25vw;
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                align-items: center;
                justify-content: center;
            }
            #controls button {
                width: 225%;
                height: 60px;
                font-size: 16px;
                margin-left: -125%;
            }
        }

        button {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            color: #fff;
            white-space: nowrap;
            height: 48px;
            width: 100%;
        }
        .btn-call { background: var(--green); }
        .btn-hangup { background: var(--red); display: none; }
        .btn-action { background: #333; border: 1px solid #444; }

        #login { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; }
        #audio-blocker { position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 150; display: none; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
        form { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 12px; }
        input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid #333; background: #111; color: #fff; font-size: 16px; outline: none; }
        .hidden { display: none !important; }
        #status { position: absolute; top: 12px; left: 12px; font-size: 10px; font-weight: bold; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; z-index: 50; letter-spacing: 0.05em; }
    </style>
</head>
<body>

<div id="status">OFFLINE</div>
<div id="door-title">Loading...</div>

<div id="nav-left" class="nav-arrow" onclick="prevDoor()">❮</div>
<div id="nav-right" class="nav-arrow" onclick="nextDoor()">❯</div>

<div id="video-container">
    <video id="video" autoplay playsinline muted></video>
    <audio id="remoteAudio" autoplay playsinline></audio>

    <div id="audio-blocker" onclick="unmuteAudio()">
        <div style="background:#fff; color:#000; padding: 20px; border-radius: 50px; font-weight: bold;">
            🔊 TAP TO HEAR AUDIO
        </div>
    </div>

    <div id="login">
        <h2 style="margin-bottom:20px; letter-spacing: -1px;">OneDoor</h2>
        <form id="login-form" onsubmit="doLogin(event)">
            <input type="text" id="username" placeholder="Username" autocomplete="username" required>
            <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
            <button type="submit" style="background:#fff; color:#000; margin-top:10px">Sign In</button>
        </form>
    </div>
</div>

<div id="controls"></div>

<script>
let ua, session, videoPC, configData;
let doors = [];
let currentDoorIndex = 0;
let currentDoor = null;
let localStream = null; // For Generic mode mic

const API = window.location.origin;
const $ = id => document.getElementById(id);
const setStatus = t => { $('status').textContent = t.toUpperCase(); };

function unmuteAudio() {
    if (currentDoor?.call_mode === 'sip') {
        $('remoteAudio').play();
    } else {
        $('video').muted = false;
        $('video').play();
    }
    $('audio-blocker').style.display = 'none';
}

// --- NAVIGATION ---
function nextDoor() {
    if (doors.length === 0) return;
    currentDoorIndex = (currentDoorIndex + 1) % doors.length;
    renderDoor();
}

function prevDoor() {
    if (doors.length === 0) return;
    currentDoorIndex = (currentDoorIndex - 1 + doors.length) % doors.length;
    renderDoor();
}

// Swipe support
let touchStartX = 0;
$('video-container').addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX, { passive: true });
$('video-container').addEventListener('touchend', e => {
    const endX = e.changedTouches[0].screenX;
    const diff = touchStartX - endX;
    if (Math.abs(diff) > 50) {
        if (diff > 0) nextDoor(); else prevDoor();
    }
}, { passive: true });

// --- MEDIA LOGIC (go2rtc) ---
async function loadMedia(door) {
    if (videoPC) videoPC.close();
    
    // Reset UI state for new door
    $('video').muted = true; 
    $('video').srcObject = null;
    $('remoteAudio').srcObject = null;

    videoPC = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

    videoPC.ontrack = e => {
        if (e.streams[0]) {
            const v = $('video');
            v.srcObject = e.streams[0];
            
            // Auto-unmute for 'none' and 'generic' (video carries audio)
            if (door.call_mode === 'none' || door.call_mode === 'generic') {
                v.muted = false;
                v.play().catch(err => console.warn("Video play pending interaction"));
            } else {
                v.play().catch(() => {});
            }
        }
    };

    videoPC.addTransceiver('video', { direction: 'recvonly' });

    // Audio handling based on mode
    if (door.call_mode === 'sip') {
        videoPC.addTransceiver('audio', { direction: 'inactive' });
    } 
    else if (door.call_mode === 'generic') {
        // Two-way audio. We need to add local mic track if available.
        if (!localStream) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                // Mute by default until "Call" is pressed
                localStream.getAudioTracks().forEach(t => t.enabled = false);
            } catch (e) {
                console.warn("Mic permission denied. Falling back to listen-only.");
            }
        }
        
        if (localStream) {
            localStream.getTracks().forEach(track => videoPC.addTrack(track, localStream));
        } else {
            videoPC.addTransceiver('audio', { direction: 'recvonly' });
        }
    } 
    else { // 'none'
        videoPC.addTransceiver('audio', { direction: 'recvonly' });
    }

    try {
        const offer = await videoPC.createOffer();
        await videoPC.setLocalDescription(offer);

        const res = await fetch(`${API}/go2rtc/api/webrtc?src=${encodeURIComponent(door.webrtc_name)}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'text/plain',
                'Authorization': `Bearer ${configData.token}`
            },
            body: videoPC.localDescription.sdp
        });

        if (!res.ok) throw new Error('Unauthorized');
        const answer = await res.text();
        await videoPC.setRemoteDescription({ type: 'answer', sdp: answer });
    } catch (e) {
        console.error("Video Error:", e);
    }
}

// --- SIP LOGIC ---
function setupSIP() {
    const wsUrl = `wss://${location.host}/ws?ws_token=${encodeURIComponent(configData.ws_token)}`;
    const socket = new JsSIP.WebSocketInterface(wsUrl);

    ua = new JsSIP.UA({
        sockets: [socket],
        uri: `sip:${configData.pbx.username}@${location.hostname}`,
        password: configData.pbx.password,
        register: true,
        session_timers: false,
        user_agent: configData.pbx.user_agent
    });

    ua.on('registered', () => setStatus('READY'));
    ua.on('registrationFailed', () => setStatus('SIP ERROR'));
    ua.on('newRTCSession', e => {
        session = e.session;
        handleSession();
    });
    ua.start();
}

function handleSession() {
    const attachTrack = () => {
        if (session && session.connection) {
            const receiver = session.connection.getReceivers().find(r => r.track && r.track.kind === 'audio');
            if (receiver && receiver.track) {
                const el = $('remoteAudio');
                el.srcObject = new MediaStream([receiver.track]);
                el.play().catch(() => {
                    $('audio-blocker').style.display = 'flex';
                });
            }
        }
    };

    session.on('peerconnection', d => {
        d.peerconnection.ontrack = () => attachTrack();
    });

    session.on('confirmed', () => {
        updateCallButton(true);
        setStatus('IN CALL');
        setTimeout(attachTrack, 100);
    });

    session.on('ended', resetUI);
    session.on('failed', resetUI);
}

function startCall() {
    if (!currentDoor) return;

    if (currentDoor.call_mode === 'sip') {
        if (!ua || !ua.isRegistered()) { setStatus("NOT READY"); return; }
        const options = {
            mediaConstraints: { audio: true, video: false },
            pcConfig: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
        };
        ua.call(`sip:${currentDoor.dial_extension}@${location.hostname}`, options);
    } 
    else if (currentDoor.call_mode === 'generic') {
        toggleMic(true);
    }
}

function hangup() {
    if (currentDoor?.call_mode === 'sip') {
        session?.terminate();
    } else if (currentDoor?.call_mode === 'generic') {
        toggleMic(false);
    }
}

function toggleMic(forceState) {
    if (!localStream) return;
    const track = localStream.getAudioTracks()[0];
    if (!track) return;

    const newState = forceState !== undefined ? forceState : !track.enabled;
    track.enabled = newState;
    updateCallButton(newState);
    setStatus(newState ? 'MIC ON' : 'MIC OFF');
}

function updateCallButton(isActive) {
    const callBtn = $('callBtn');
    const hangBtn = $('hangupBtn');
    if (!callBtn || !hangBtn) return;

    if (isActive) {
        callBtn.style.display = 'none';
        hangBtn.style.display = 'flex';
    } else {
        callBtn.style.display = 'flex';
        hangBtn.style.display = 'none';
    }
}

function resetUI() {
    updateCallButton(false);
    $('audio-blocker').style.display = 'none';
    setStatus('READY');
}

// --- RENDER DOOR ---
function renderDoor() {
    if (!doors.length) return;
    currentDoor = doors[currentDoorIndex];
    
    // Update Title
    $('door-title').textContent = currentDoor.id.replace(/_/g, ' ');

    // Update Controls
    const ctrl = $('controls');
    ctrl.innerHTML = '';

    // 1. Call/End Button (SIP & Generic only)
    if (currentDoor.call_mode === 'sip' || currentDoor.call_mode === 'generic') {
        const callBtn = document.createElement('button');
        callBtn.id = 'callBtn';
        callBtn.className = 'btn-call';
        callBtn.innerHTML = currentDoor.call_mode === 'sip' ? '📞 CALL' : '🎙️ TALK';
        callBtn.onclick = startCall;
        ctrl.appendChild(callBtn);

        const hangBtn = document.createElement('button');
        hangBtn.id = 'hangupBtn';
        hangBtn.className = 'btn-hangup';
        hangBtn.innerHTML = '📴 END';
        hangBtn.onclick = hangup;
        ctrl.appendChild(hangBtn);
    }

    // 2. Actions
    (currentDoor.actions || []).forEach(action => {
        const btn = document.createElement('button');
        btn.className = 'btn-action';
        btn.innerHTML = `${action.icon || '⚡'} ${action.label}`;
        btn.onclick = () => runAction(action);
        ctrl.appendChild(btn);
    });

    // 3. Load Media
    loadMedia(currentDoor);
    
    // Reset UI state
    resetUI();
}

// --- ACTION LOGIC ---
async function runAction(action) {
    if (action.type === 'dtmf') {
        if (currentDoor.call_mode === 'sip' && session) {
            session.sendDTMF(action.payload);
            setStatus(`SENT: ${action.payload}`);
        } else if (currentDoor.call_mode === 'generic') {
             setStatus('DTMF N/A'); // go2rtc doesn't support DTMF via API easily in this context
        }
    } else if (action.type === 'hook') {
        setStatus('SENDING...');
        const res = await fetch(`${API}/api/action`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${configData.token}`
            },
            body: JSON.stringify({ doorId: currentDoor.id, actionId: action.id })
        });
        if (res.ok) setStatus('SUCCESS');
    } else if (action.type === 'link') {
        if (action.url) window.location.href = action.url;
    }
    setTimeout(() => setStatus(session?.isEstablished() ? 'IN CALL' : 'READY'), 2000);
}

// --- AUTH & INIT ---
async function doLogin(event) {
    event.preventDefault();
    const u = $('username').value, p = $('password').value;
    try {
        const res = await fetch(`${API}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        });
        if (!res.ok) throw new Error('Auth Failed');
        configData = await res.json();
        localStorage.setItem('jwt', configData.token);
        initApp();
    } catch (e) { alert(e.message); }
}

window.onload = () => {
    const token = localStorage.getItem('jwt');
    if (token) {
        fetch(`${API}/api/verify`, { headers: { 'Authorization': 'Bearer ' + token } })
        .then(res => res.json())
        .then(data => {
            if (data.valid) { configData = data; initApp(); }
        }).catch(() => localStorage.removeItem('jwt'));
    }
};

async function initApp() {
    $('login').classList.add('hidden');
    $('controls').style.display = 'flex'; // Or grid, handled by CSS
    
    doors = configData.doors || [];
    if (doors.length === 0) {
        alert("No doors configured.");
        return;
    }

    // Deep Link Handling
    const params = new URLSearchParams(window.location.search);
    const targetDoorId = params.get('door');
    if (targetDoorId) {
        const idx = doors.findIndex(d => d.id === targetDoorId);
        if (idx !== -1) currentDoorIndex = idx;
    }

    renderDoor();
    setupSIP(); // Init SIP UA once
    initPushFlow();
}

// ... [Keep Push Logic exactly as before] ...
const PUSH_LATER_KEY = 'onedoor_push_later';
const PUSH_WEEK_MS = 7 * 24 * 60 * 60 * 1000;

function urlBase64ToUint8Array(base64url) {
  let base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
  const pad = (4 - base64.length % 4) % 4;
  base64 += '='.repeat(pad);
  const binary = atob(base64);
  return new Uint8Array([...binary].map(c => c.charCodeAt(0)));
}

async function registerPush() {
  if (!configData?.vapid_public_key) return;
  try {
    const reg = await navigator.serviceWorker.getRegistration('/') || await navigator.serviceWorker.register('/service-worker.js');
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(configData.vapid_public_key) });
    }
    await fetch(`${location.origin}/api/register-notification`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${configData.token}` },
      body: JSON.stringify({ subscription: sub.toJSON() })
    });
  } catch(e) { console.error('Push Reg Error:', e); }
}

function showPushModal(force = false) {
  if (!configData?.vapid_public_key) return;
  if (!force && Notification.permission !== 'default') return;
  if (!force && Date.now() - parseInt(localStorage.getItem(PUSH_LATER_KEY) || '0') < PUSH_WEEK_MS) return;
  if (!force && localStorage.getItem('push_opted') === 'denied') return;

  const title = force ? "Re-enable Notifications?" : "Instant Door Alerts?";
  const msg = force ? "Tap to restore instant door alerts." : "Tap to open when someone rings.";

  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  el.innerHTML = `
    <div style="background:#111;border:1px solid #333;border-radius:14px;padding:20px;max-width:300px;width:100%;text-align:center;">
      <div style="font-size:24px;margin-bottom:8px;">🔔</div>
      <h3 style="margin:0 0 6px;font-size:16px;">${title}</h3>
      <p style="margin:0 0 16px;font-size:13px;color:#999;">${msg}</p>
      <div style="display:flex;gap:10px;">
        <button id="push-allow" style="flex:1;padding:10px;border:none;border-radius:8px;background:#22c55e;color:#fff;font-weight:600;">Allow</button>
        ${!force ? `<button id="push-later" style="flex:1;padding:10px;border:none;border-radius:8px;background:#222;color:#aaa;font-weight:600;">Later</button>` : ''}
      </div>
    </div>`;
  document.body.appendChild(el);

  document.getElementById('push-allow').onclick = async () => {
    el.remove();
    await Notification.requestPermission();
    localStorage.setItem('push_opted', 'allowed');
    registerPush();
  };

  if (!force) {
    document.getElementById('push-later').onclick = () => {
      el.remove();
      localStorage.setItem(PUSH_LATER_KEY, Date.now().toString());
    };
  }
}

async function initPushFlow() {
  if (!configData?.vapid_public_key) return;
  if (!('Notification' in window)) return;

  const perm = Notification.permission;
  if (configData.push_status === 'missing' && perm === 'granted') {
    localStorage.removeItem('push_opted');
    showPushModal(true);
    return;
  }

  if (perm === 'granted') {
    await registerPush();
  } else if (perm === 'default') {
    setTimeout(() => showPushModal(false), 1500);
  }
}
</script>
</body>
</html>
