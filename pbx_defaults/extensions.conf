[intercom-logic]
; 700 — entry point for both directions
exten => 700,1,NoOp(Inbound call to 700 from endpoint ${CHANNEL(endpoint)})

; If Aiphone (105) calls 700 → fire webhook + hangup
 same => n,GotoIf($["${CHANNEL(endpoint)}" = "105"]?aiphone-callback)

; Otherwise → app user path
 same => n,Goto(app-user)

; ----- Aiphone callback → webhook -----
exten => 700,n(aiphone-callback),NoOp(Aiphone 105 callback → firing webhook)
 same => n,System(/app/doorbell-webhook.sh)
 same => n,Hangup()

; ----- App user path → call 105 + bridge -----
exten => 700,n(app-user),NoOp(App user calling 700 → calling Aiphone)
 same => n,Set(CALLERID(all)="OneDoor" <700>)
 same => n,Originate(Local/call-aiphone@intercom-logic,exten,intercom-logic,701,1,30,a(f(700)))
 same => n,ConfBridge(intercom_bridge,,app_user)
 same => n,Hangup()

; ----- Outbound leg to Aiphone (105) -----
exten => call-aiphone,1,NoOp(Calling Aiphone 105)
 same => n,Set(CALLERID(all)="OneDoor App" <700>)
 same => n,Dial(PJSIP/105)
 same => n,Hangup()

; ----- Aiphone joins the bridge -----
exten => 701,1,NoOp(Aiphone connected → joining bridge)
 same => n,Answer()
 same => n,ConfBridge(intercom_bridge,,aiphone)
 same => n,Hangup()
