; ============================================================================
; DOOR 1: Endpoint 105 | Extension 700 | Room: room_700
; ============================================================================
[intercom-logic]
exten => 700,1,NoOp(Inbound call to 700 from endpoint ${CHANNEL(endpoint)})
 same => n,GotoIf($["${CHANNEL(endpoint)}" = "105"]?aiphone-callback)
 same => n,Goto(app-user)

exten => 700,n(aiphone-callback),NoOp(Door 1 (105) callback → firing webhook)
 same => n,System(/app/doorbell-webhook.sh 700)
 same => n,Hangup()

exten => 700,n(app-user),NoOp(App user calling 700 → calling Door 1)
 same => n,Set(CALLERID(all)="OneDoor" <700>)
 same => n,Originate(Local/call-aiphone@intercom-logic,exten,call-aiphone,intercom-logic,1)
 same => n,ConfBridge(room_700,default_bridge,app_user)
 same => n,Hangup()

exten => call-aiphone,1,NoOp(Calling Door 1 (105))
 same => n,Set(CALLERID(all)="OneDoor App" <700>)
 same => n,Dial(PJSIP/105,30,G(intercom-logic^701^1))
 same => n,Hangup()

exten => 701,1,NoOp(Door 1 connected → joining bridge)
 same => n,Answer()
 same => n,ConfBridge(room_700,default_bridge,aiphone)
 same => n,Hangup()


