[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk

[options]
console = no
; Disable high-frequency status updates that poll the CPU
highpriority = yes
; Prevent Asterisk from trying to interact with terminal input
nolockleadingmode = yes
; Turn off fancy colors that mess up log parsing
hideconnect = yes
; Disable internal system resource polling
systemname = OneDoor

[threadpools]
; Cap idle worker threads to prevent polling overhead
default_min_threads = 2
default_max_threads = 8

; PJSIP-specific limits (optional but recommended)
pjsip_min_threads = 2
pjsip_max_threads = 8
